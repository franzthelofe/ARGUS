; ============================================================
; ARGUS - Search and Rescue Robot — Head Module
; Full merged build: camera, two-way audio (WebSocket),
; thermal detection (MLX90640), web interface.
; ============================================================

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv

lib_deps =
    links2004/WebSockets @ ^2.4.1
    adafruit/Adafruit MLX90640 @ ^1.1.1

build_flags =
    -D CORE_DEBUG_LEVEL=3